---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gatus.home-operations.com/endpoint: |
      name: "Homepage"
  name: homepage
  namespace: homepage
spec:
  hostnames: ["home.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: homepage
          namespace: homepage
          port: 3000
      matches:
        - path:
            type: PathPrefix
            value: /
