---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Provider
metadata:
  name: discord
  namespace: homepage
spec:
  type: discord
  secretRef:
    name: discord-webhook
---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: homepage-alert
  namespace: homepage
spec:
  eventMetadata:
    summary: "Homepage"
  providerRef:
    name: discord
  eventSeverity: info
  exclusionList:
    - "Dependencies do not meet ready condition"
  eventSources:
    - kind: Kustomization
      name: '*'
      namespace: homepage
