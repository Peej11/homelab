---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: csi-driver-nfs-alert
  namespace: flux-system
spec:
  summary: "CSI Driver NFS"
  providerRef:
    name: discord
  eventSeverity: info
  exclusionList:
    - "Dependencies do not meet ready condition"
  eventSources:
    - kind: HelmRepository
      name: '*'
      namespace: csi-driver-nfs
    - kind: HelmChart
      name: '*'
      namespace: csi-driver-nfs
    - kind: HelmRelease
      name: '*'
      namespace: csi-driver-nfs
