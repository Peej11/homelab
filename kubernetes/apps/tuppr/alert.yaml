---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Provider
metadata:
  name: discord
  namespace: tuppr
spec:
  type: discord
  secretRef:
    name: discord-webhook
---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: tuppr-alert
  namespace: tuppr
spec:
  eventMetadata:
    summary: "Tuppr"
  providerRef:
    name: discord
  eventSeverity: info
  exclusionList:
    - "Dependencies do not meet ready condition"
  eventSources:
    - kind: Kustomization
      name: 'tuppr'
      namespace: tuppr
    - kind: HelmRelease
      name: 'tuppr'
      namespace: tuppr
    - kind: OCIRepository
      name: 'tuppr'
      namespace: tuppr
---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: tuppr-config-alert
  namespace: tuppr
spec:
  eventMetadata:
    summary: "Tuppr Config"
  providerRef:
    name: discord
  eventSeverity: info
  exclusionList:
    - "Dependencies do not meet ready condition"
  eventSources:
    - kind: Kustomization
      name: 'tuppr-config'
      namespace: tuppr
