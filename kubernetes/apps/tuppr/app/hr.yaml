---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
  namespace: tuppr
spec:
  chartRef:
    kind: OCIRepository
    name: tuppr
  interval: 24h
  upgrade:
    crds: CreateReplace
    remediation:
      remediateLastFailure: true
  values:
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: tuppr
            topologyKey: kubernetes.io/hostname
    replicaCount: 2
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: tuppr
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: tuppr
              spec:
                revisionHistoryLimit: 3
