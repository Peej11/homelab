---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: reflector
  namespace: flux-system
spec:
  eventMetadata:
    summary: "Reflector"
  providerRef:
    name: discord
  eventSeverity: info
  exclusionList:
    - "Dependencies do not meet ready condition"
  eventSources:
    - kind: OCIRepository
      name: '*'
      namespace: reflector
    - kind: HelmRelease
      name: '*'
      namespace: reflector
