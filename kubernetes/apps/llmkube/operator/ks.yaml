---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app llmkube-operator
  namespace: llmkube
  labels:
    app.kubernetes.io/name: *app
    app.kubernetes.io/part-of: &namespace llmkube
spec:
  dependsOn:
    - name: cluster-apps
      namespace: flux-system
    - name: nvidia-device-plugin
      namespace: nvidia-device-plugin
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      app.kubernetes.io/namespace: *namespace
  interval: 4h
  path: ./kubernetes/apps/llmkube/operator/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 10m
  wait: true
