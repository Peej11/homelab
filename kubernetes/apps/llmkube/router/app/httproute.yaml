---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm
  namespace: llmkube
spec:
  hostnames: ["llm.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: llm-router-proxy
          namespace: llmkube
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /
