---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app llmkube-qwen3-embedding-0-6b
  namespace: llmkube
  labels:
    app.kubernetes.io/name: *app
    app.kubernetes.io/part-of: &namespace llmkube
spec:
  dependsOn:
    - name: llmkube-operator
      namespace: llmkube
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      app.kubernetes.io/namespace: *namespace
  interval: 4h
  path: ./kubernetes/apps/llmkube/models/qwen3-embedding-0-6b/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 15m
  wait: false
