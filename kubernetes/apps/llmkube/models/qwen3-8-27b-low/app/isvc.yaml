---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-8-27b-low
  namespace: llmkube
spec:
  modelRef: qwen3-8-27b
  runtime: llamacpp
  runtimeClassName: nvidia
  mode: chat
  replicas: 1
  podLabels:
    llmkube-model: "true"
  contextSize: 125000
  parallelSlots: 1
  reasoningBudget: 8192
  reasoningBudgetMessage: "Reasoning budget reached. Answer now with what you have."
  flashAttention: true
  jinja: true
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  extraArgs:
    - --alias
    - qwen3.8-27b-low
    - --reasoning-preserve
    - --chat-template-kwargs
    - '{"reasoning_effort":"low"}'
  resources:
    cpu: "1"
    memory: 8Gi
    gpu: 1
  endpoint:
    type: ClusterIP
    port: 8080
    path: /v1/chat/completions
