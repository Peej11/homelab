---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: muse-glimmer-30b
  namespace: llmkube
spec:
  source: hf://unsloth/Muse-Glimmer-30B-GGUF
  files:
    - Muse-Glimmer-30B-UD-Q4_K_XL.gguf
    - dflash-kquant.gguf
  mmproj: mmproj-Muse-Glimmer-30B-BF16.gguf
  format: gguf
  quantization: UD-Q4_K_XL
  refreshPolicy: IfNotPresent
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      count: 1
      layers: -1
