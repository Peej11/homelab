---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: muse-glimmer-30b
  namespace: llmkube
spec:
  modelRef: muse-glimmer-30b
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-cuda-b10481
  runtimeClassName: nvidia
  mode: chat
  replicas: 1
  podLabels:
    llmkube-model: "true"
  contextSize: 32768
  parallelSlots: 1
  flashAttention: true
  jinja: true
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  extraArgs:
    - --alias
    - muse-glimmer-30b
  resources:
    cpu: "1"
    memory: 8Gi
    gpu: 1
  endpoint:
    type: ClusterIP
    port: 8080
    path: /v1/chat/completions
