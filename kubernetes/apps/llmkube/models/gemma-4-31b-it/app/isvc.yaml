---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: gemma-4-31b-it
  namespace: llmkube
spec:
  modelRef: gemma-4-31b-it
  runtime: llamacpp
  runtimeClassName: nvidia
  mode: chat
  podLabels:
    llmkube-model: "true"
  contextSize: 32768
  parallelSlots: 1
  flashAttention: true
  jinja: true
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  extraArgs:
    - --alias
    - gemma-4-31b-it
  resources:
    cpu: "1"
    memory: 8Gi
    gpu: 1
  endpoint:
    type: ClusterIP
    port: 8080
    path: /v1/chat/completions
