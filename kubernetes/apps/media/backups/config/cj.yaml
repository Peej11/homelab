---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rsync-audiobooks
  namespace: media
spec:
  schedule: "0 0,6,12,18 * * *"
  timeZone: "America/Chicago"
  concurrencyPolicy: Replace
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: rsync
              image: ghcr.io/peej11/rsync:3.4.3@sha256:6c60edc6a23dcc47aeeb391ab1e7180bd2e93a49f7c30ee68b078af8eb5a9429
              command:
                - /bin/sh
                - -c
                - rsync --bwlimit=5000 -avh --progress --delete /src/audiobooks/ /dst/
              volumeMounts:
                - name: mjolnir-media
                  mountPath: /src
                  readOnly: true
                - name: media-audiobooks
                  mountPath: /dst
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: mjolnir-media
              persistentVolumeClaim:
                claimName: pvc-media-smb
                readOnly: true
            - name: media-audiobooks
              persistentVolumeClaim:
                claimName: media-audiobooks
          restartPolicy: OnFailure
---
