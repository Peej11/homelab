---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app plex
  namespace: media
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: app-template
  interval: 1h
  values:
    controllers:
      plex:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/plex
              tag: 1.43.2.10687@sha256:be00a2ad851ea3193cd870636f908eb6425ad89390f23cdb08daa35ab5cceacc
              pullPolicy: IfNotPresent
            env:
              TZ: America/Chicago
              PLEX_ADVERTISE_URL: "https://plex.${SECRET_DOMAIN}"
              ALLOWED_NETWORKS: "10.0.0.0/8"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /identity
                    port: 32400
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /identity
                    port: 32400
                  initialDelaySeconds: 30
                  periodSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 1000m
                memory: 2Gi
                nvidia.com/gpu: "1"
              limits:
                memory: 4Gi
                nvidia.com/gpu: "1"
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      runtimeClassName: nvidia
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: 32400
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            name: "Plex"
            conditions: ["[STATUS] == 401"]
        hostnames:
          - "plex.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    persistence:
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteMany
        size: 50Gi
        storageClass: rook-cephfs
        retain: true
        globalMounts:
          - path: /config
      transcode:
        type: emptyDir
        sizeLimit: 8Gi
        globalMounts:
          - path: /transcode
      dvr:
        existingClaim: media-dvr
        globalMounts:
          - path: /media/dvr
            readOnly: true
      movies:
        existingClaim: media-movies
        globalMounts:
          - path: /media/movies
            readOnly: true
      music:
        existingClaim: media-music
        globalMounts:
          - path: /media/music
            readOnly: true
      preroll:
        existingClaim: media-preroll
        globalMounts:
          - path: /media/preroll
            readOnly: true
      tv:
        existingClaim: media-tv
        globalMounts:
          - path: /media/tv
            readOnly: true
      workouts:
        existingClaim: media-workouts
        globalMounts:
          - path: /media/workouts
            readOnly: true
