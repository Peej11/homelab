---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
  labels:
    app.kubernetes.io/name: jellyfin
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  template:
    metadata:
      name: jellyfin
      labels:
        app.kubernetes.io/name: jellyfin
    spec:
      runtimeClassName: nvidia
      containers:
        - name: jellyfin
          image: ghcr.io/jellyfin/jellyfin:10.11.11@sha256:45f648c382a0c8b552582fcea40e95cb17c5d475473a891cba0eb7523fb92112
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8096
              protocol: TCP
            - name: https
              containerPort: 8920
              protocol: TCP
          resources:
            requests:
              cpu: 1000m
              memory: 2048Mi
              nvidia.com/gpu: "1"
            limits:
              memory: 2048Mi
              nvidia.com/gpu: "1"
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: transcode
              mountPath: /transcode
            - name: dvr
              mountPath: /media/dvr
              readOnly: true
            - name: movies
              mountPath: /media/movies
              readOnly: true
            - name: music
              mountPath: /media/music
              readOnly: true
            - name: preroll
              mountPath: /media/preroll
              readOnly: true
            - name: tv
              mountPath: /media/tv
              readOnly: true
            - name: workouts
              mountPath: /media/workouts
              readOnly: true
          livenessProbe:
            httpGet:
              path: /System/Ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /System/Ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          startupProbe:
            httpGet:
              path: /System/Ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 10
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: cache
          persistentVolumeClaim:
            claimName: jellyfin-cache
        - name: transcode
          emptyDir:
            sizeLimit: 8Gi
        - name: dvr
          persistentVolumeClaim:
            claimName: media-dvr
        - name: movies
          persistentVolumeClaim:
            claimName: media-movies
        - name: music
          persistentVolumeClaim:
            claimName: media-music
        - name: preroll
          persistentVolumeClaim:
            claimName: media-preroll
        - name: tv
          persistentVolumeClaim:
            claimName: media-tv
        - name: workouts
          persistentVolumeClaim:
            claimName: media-workouts
