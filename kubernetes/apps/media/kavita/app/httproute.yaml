---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gatus.home-operations.com/endpoint: |
      name: "Kavita"
  name: kavita
  namespace: media
spec:
  hostnames: ["kavita.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: kavita
          namespace: media
          port: 5000
      matches:
        - path:
            type: PathPrefix
            value: /
