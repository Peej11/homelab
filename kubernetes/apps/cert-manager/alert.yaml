---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: discord
  namespace: cert-manager
spec:
  type: discord
  secretRef:
    name: discord-webhook
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: cert-manager-alert
  namespace: cert-manager
spec:
  summary: "Cert-Manager"
  providerRef:
    name: discord
  eventSeverity: info
  exclusionList:
    - "Dependencies do not meet ready condition"
  eventSources:
    - kind: Kustomization
      name: 'cert-manager'
      namespace: cert-manager
    - kind: HelmRelease
      name: 'cert-manager'
      namespace: cert-manager
    - kind: OCIRepository
      name: 'cert-manager'
      namespace: cert-manager
