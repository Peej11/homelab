---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate
  namespace: renovate-operator
spec:
  chartRef:
    kind: OCIRepository
    name: renovate
  interval: 24h
  upgrade:
    crds: CreateReplace
    remediation:
      remediateLastFailure: true
  values:
    route:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |
          name: "Renovate UI"
      hostnames: ["renovate.${SECRET_DOMAIN}"]
      parentRefs:
        - name: envoy-internal
          namespace: network
          sectionName: https
    webhook:
      enabled: true
      port: 8082
      route:
        enabled: true
        annotations:
          gatus.home-operations.com/endpoint: |
            name: "Renovate Webhook"
            conditions:
              - "[STATUS] == 401"
              - "[RESPONSE_TIME] < 500"
        hostnames: ["renovate-webhook.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
