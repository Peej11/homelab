---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: rook-alert
  namespace: flux-system
spec:
  eventMetadata:
    summary: "Rook-Ceph"
  providerRef:
    name: discord
  eventSeverity: info
  exclusionList:
    - "Dependencies do not meet ready condition"
  eventSources:
    - kind: HelmRepository
      name: '*'
      namespace: rook-ceph
    - kind: HelmChart
      name: '*'
      namespace: rook-ceph
    - kind: HelmRelease
      name: '*'
      namespace: rook-ceph
