---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: openwebui
  namespace: openwebui
spec:
  bootstrap:
    initdb:
      database: openwebui
      owner: openwebui
  enableSuperuserAccess: true
  instances: 3
  monitoring:
    enablePodMonitor: true
  storage:
    storageClass: rook-cephbp
    size: 5Gi
