---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: openwebui
  namespace: openwebui
spec:
  backup:
    target: primary
    volumeSnapshot:
      className: rook-ceph-cephfs-snapclass
      snapshotOwnerReference: cluster
  bootstrap:
    initdb:
      database: openwebui
      owner: openwebui
  enableSuperuserAccess: true
  instances: 3
  monitoring:
    enablePodMonitor: true
  storage:
    storageClass: rook-cephfs
    size: 5Gi
