---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui
  namespace: openwebui
  labels:
    app.kubernetes.io/name: openwebui
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openwebui
  template:
    metadata:
      name: openwebui
      labels:
        app.kubernetes.io/name: openwebui
    spec:
      containers:
        - name: openwebui
          image: ghcr.io/open-webui/open-webui:v0.10.2-slim@sha256:f03f7fcdaf5e3381b3d505c0e66f2bf4e82d1918082022b85dee7da1299b6efd
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ENABLE_PERSISTENT_CONFIG
              value: "false"
            - name: ENABLE_OLLAMA_API
              value: "false"
            - name: OPENAI_API_BASE_URL
              value: "http://vllm-inference.vllm.svc.cluster.local:8000/v1"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-api-key
                  key: api-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: openwebui-app
                  key: uri
            - name: WEBUI_SESSION_COOKIE_SECURE
              value: "true"
            - name: WEBUI_SESSION_COOKIE_SAME_SITE
              value: "strict"
            - name: WEBUI_URL
              value: "https://openwebui.${SECRET_DOMAIN}"
            - name: CORS_ALLOW_ORIGIN
              value: "https://openwebui.${SECRET_DOMAIN}"
            - name: HSTS
              value: "max-age=31536000;includeSubDomains"
            - name: XFRAME_OPTIONS
              value: "DENY"
            - name: XCONTENT_TYPE
              value: "nosniff"
            - name: REFERRER_POLICY
              value: "strict-origin-when-cross-origin"
            - name: OFFLINE_MODE
              value: "true"
            - name: ENABLE_OPENAI_API_PASSTHROUGH
              value: "false"
            - name: ENABLE_COMMUNITY_SHARING
              value: "false"
            - name: ENABLE_CODE_EXECUTION
              value: "false"
            - name: ENABLE_SIGNUP
              value: "false"
            - name: ENABLE_WEB_SEARCH
              value: "true"
            - name: ENABLE_RAG_WEB_SEARCH
              value: "true"
            - name: WEB_SEARCH_ENGINE
              value: "brave"
            - name: WEB_SEARCH_RESULT_COUNT
              value: "3"
            - name: WEB_SEARCH_CONCURRENT_REQUESTS
              value: "1"
            - name: BYPASS_EMBEDDING_AND_RETRIEVAL
              value: "false"
            - name: RAG_EMBEDDING_ENGINE
              value: "openai"
            - name: RAG_OPENAI_API_BASE_URL
              value: "http://vllm-embedding.vllm.svc.cluster.local:8000/v1"
            - name: RAG_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-api-key
                  key: api-key
            - name: RAG_EMBEDDING_MODEL
              value: "Qwen/Qwen3-Embedding-0.6B"
          envFrom:
            - secretRef:
                name: openwebui-config
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openwebui-data
