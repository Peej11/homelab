---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui
  namespace: openwebui
  labels:
    app.kubernetes.io/name: openwebui
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openwebui
  template:
    metadata:
      name: openwebui
      labels:
        app.kubernetes.io/name: openwebui
    spec:
      containers:
        - name: openwebui
          image: ghcr.io/open-webui/open-webui:v0.11.1-slim@sha256:d4fb182e83c459d66cd2d23a2b7131f56f68a9cd50420f4402444e33e7033e8d
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ENABLE_PERSISTENT_CONFIG
              value: "false"
            - name: OFFLINE_MODE
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: openwebui-app
                  key: uri
            - name: ENABLE_OLLAMA_API
              value: "false"
            - name: ENABLE_OPENAI_API
              value: "true"
            - name: OPENAI_API_BASE_URL
              value: "http://llm-router-proxy.llmkube.svc.cluster.local:8080/v1"
            - name: AIOHTTP_CLIENT_TIMEOUT
              value: "900"
            - name: WEBUI_URL
              value: "https://openwebui.${SECRET_DOMAIN}"
            - name: CORS_ALLOW_ORIGIN
              value: "https://openwebui.${SECRET_DOMAIN}"
            - name: WEBUI_SESSION_COOKIE_SECURE
              value: "true"
            - name: WEBUI_SESSION_COOKIE_SAME_SITE
              value: "strict"
            - name: HSTS
              value: "max-age=31536000;includeSubDomains"
            - name: XFRAME_OPTIONS
              value: "DENY"
            - name: XCONTENT_TYPE
              value: "nosniff"
            - name: REFERRER_POLICY
              value: "strict-origin-when-cross-origin"
            - name: ENABLE_SIGNUP
              value: "false"
            - name: ENABLE_COMMUNITY_SHARING
              value: "false"
            - name: ENABLE_CODE_EXECUTION
              value: "false"
            - name: ENABLE_OPENAI_API_PASSTHROUGH
              value: "false"
            - name: ENABLE_TITLE_GENERATION
              value: "false"
            - name: ENABLE_TAGS_GENERATION
              value: "false"
            - name: ENABLE_FOLLOW_UP_GENERATION
              value: "false"
            - name: ENABLE_RETRIEVAL_QUERY_GENERATION
              value: "false"
            - name: ENABLE_SEARCH_QUERY_GENERATION
              value: "false"
            - name: ENABLE_WEB_SEARCH
              value: "true"
            - name: WEB_SEARCH_ENGINE
              value: "brave"
            - name: WEB_SEARCH_RESULT_COUNT
              value: "3"
            - name: WEB_SEARCH_CONCURRENT_REQUESTS
              value: "1"
            - name: BYPASS_EMBEDDING_AND_RETRIEVAL
              value: "true"
            - name: BYPASS_MODEL_ACCESS_CONTROL
              value: "true"
          envFrom:
            - secretRef:
                name: openwebui-config
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openwebui-data
