---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    gatus.home-operations.com/endpoint: |
      name: "Open WebUI"
  name: openwebui
  namespace: openwebui
spec:
  hostnames: ["openwebui.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: openwebui
          namespace: openwebui
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /
