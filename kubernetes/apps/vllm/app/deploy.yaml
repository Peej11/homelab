---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-inference
  namespace: vllm
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
    spec:
      runtimeClassName: nvidia
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.19.1@sha256:2622f38a0aa646c15ccc27bd5033911a58fd94ac69fd8f86aba0692d77cfe5b9
        command: ["/bin/sh", "-c"]
        args:
          - vllm serve google/gemma-4-E4B-it --gpu-memory-utilization 0.75 --max-model-len 65536 --api-key $VLLM_API_KEY
        env:
        - name: VLLM_LOGGING_LEVEL
          value: DEBUG
        - name: VLLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: auth-api-key
              key: api-key
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token-secret
              key: token
        ports:
          - name: http
            containerPort: 8000
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 4Gi
            nvidia.com/gpu: "1"
          limits:
            memory: 8Gi
            nvidia.com/gpu: "1"
        volumeMounts:
          - name: vllm-models
            mountPath: /root/.cache/huggingface
      volumes:
      - name: vllm-models
        persistentVolumeClaim:
          claimName: vllm-models
