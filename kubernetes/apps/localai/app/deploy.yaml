---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localai
  namespace: localai
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: localai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: localai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: localai
    spec:
      containers:
        - name: localai
          image: quay.io/go-skynet/local-ai:v4.1.2-gpu-nvidia-cuda-13@sha256:87619f8fd7f95936a034d50b739861b465ebfc61d0c876a391bce2f09eabae40
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: THREADS
              value: "6"
            - name: MODELS_PATH
              value: /models
            - name: PARALLEL_REQUESTS
              value: "1"
            - name: CONTEXT_SIZE
              value: "8192"
          volumeMounts:
            - name: models
              mountPath: /models
            - name: backends
              mountPath: /backends
          resources:
            requests:
              cpu: "4"
              memory: 4Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "6"
              memory: 8Gi
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
      runtimeClassName: nvidia
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: localai-models
        - name: backends
          persistentVolumeClaim:
            claimName: localai-backends
