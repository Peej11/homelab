---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localai
  namespace: localai
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: localai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: localai
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: localai
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
      initContainers:
        - name: model-loader
          image: alpine:3.23
          command:
            - /bin/sh
            - -c
            - |
              if [ -f /models/gemma-2-2b-it-Q4_K_M.gguf ]; then
                echo "Model already present, skipping download."
              else
                echo "Downloading Gemma 2 2B Instruct Q4_K_M (~1.6Gi)..." && \
                wget -q -O /models/gemma-2-2b-it-Q4_K_M.gguf \
                  https://huggingface.co/bartowski/gemma-2-2b-it-GGUF/resolve/main/gemma-2-2b-it-Q4_K_M.gguf
              fi && \
              echo "Init complete."
          volumeMounts:
            - name: models
              mountPath: /models
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 1Gi
      containers:
        - name: localai
          image: quay.io/go-skynet/local-ai:v4.1.1-gpu-hipblas@sha256:56ef8edb50ec28941307ad2dc73e00812d5d2333eed3dd6143d9d1acce838a4d
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: THREADS
              value: "6"
            - name: GPU_LAYERS
              value: "0"
            - name: MODELS_PATH
              value: /models
            - name: PARALLEL_REQUESTS
              value: "1"
            - name: CONTEXT_SIZE
              value: "8192"
          volumeMounts:
            - name: models
              mountPath: /models
            - name: backends
              mountPath: /backends
            - name: config
              mountPath: /models/gemma-2-2b.yaml
              subPath: gemma-2-2b.yaml
          resources:
            requests:
              cpu: "4"
              memory: 4Gi
            limits:
              cpu: "6"
              memory: 8Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 12
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 10
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: localai-models
        - name: backends
          persistentVolumeClaim:
            claimName: localai-backends
        - name: config
          configMap:
            name: gemma-2-2b
