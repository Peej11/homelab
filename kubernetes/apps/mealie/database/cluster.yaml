---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mealie
  namespace: mealie
spec:
  bootstrap:
    initdb:
      database: mealie
      owner: mealie
  enableSuperuserAccess: true
  instances: 3
  monitoring:
    enablePodMonitor: true
  storage:
    storageClass: rook-cephbp
    size: 2Gi
