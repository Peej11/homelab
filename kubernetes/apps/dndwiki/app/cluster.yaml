---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: dndwiki
  namespace: dndwiki
spec:
  backup:
    target: primary
    volumeSnapshot:
      className: rook-ceph-cephfs-snapclass
      snapshotOwnerReference: cluster
  bootstrap:
    initdb:
      database: dndwiki
      owner: dndwiki
  instances: 3
  storage:
    storageClass: rook-cephfs
    size: 3Gi
