---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  chart:
    spec:
      chart: kube-prometheus-stack
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
      version: 88.3.0
  install:
    crds: Create
    remediation:
      retries: 3
  interval: 24h
  timeout: 10m
  upgrade:
    crds: CreateReplace
    remediation:
      remediateLastFailure: true
  valuesFrom:
    - kind: ConfigMap
      name: kube-prometheus-stack-ksm-flux
      valuesKey: values.yaml
  values:
    alertmanager:
      alertmanagerSpec:
        replicas: 2
        podAntiAffinity: hard
        podAntiAffinityTopologyKey: kubernetes.io/hostname
    grafana:
      replicas: 1
      service:
        sessionAffinity: ClientIP
      admin:
        existingSecret: grafana-credentials
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: false
      grafana.ini:
        auth.anonymous:
          enabled: true
          org_name: Main Org.
          org_role: Viewer
      extraContainers: |
        - name: ensure-playlist
          image: curlimages/curl:8.21.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: GRAFANA_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-credentials
                  key: admin-user
            - name: GRAFANA_PASS
              valueFrom:
                secretKeyRef:
                  name: grafana-credentials
                  key: admin-password
          resources:
            requests:
              cpu: 1m
              memory: 32Mi
            limits:
              memory: 32Mi
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              G="http://localhost:3000"
              API="$G/apis/playlist.grafana.app/v0alpha1/namespaces/default/playlists"
              n=0
              until curl -sf -o /dev/null "$G/api/health"; do
                n=$((n + 1))
                [ "$n" -gt 60 ] && echo "grafana not ready after 5m" && exit 1
                sleep 5
              done
              while true; do
                code=$(curl -s -o /dev/null -w '%{http_code}' -u "$GRAFANA_USER:$GRAFANA_PASS" "$API/rpi-monitoring")
                if [ "$code" = "404" ]; then
                  echo "creating playlist rpi-monitoring"
                  curl -sf -u "$GRAFANA_USER:$GRAFANA_PASS" -H 'Content-Type: application/json' -X POST "$API" -d '{
                    "apiVersion": "playlist.grafana.app/v0alpha1",
                    "kind": "Playlist",
                    "metadata": { "name": "rpi-monitoring" },
                    "spec": { "title": "RPi Monitoring", "interval": "30s", "items": [ { "type": "dashboard_by_tag", "value": "rpi-monitoring" } ] }
                  }' && echo "created"
                elif [ "$code" = "200" ]; then
                  echo "playlist present"
                else
                  echo "unexpected status $code"
                fi
                sleep 300
              done
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: 'grafana-dashboards-kubernetes'
              orgId: 1
              folder: 'Kubernetes'
              type: file
              disableDeletion: true
              editable: false
              options:
                path: /var/lib/grafana/dashboards/grafana-dashboards-kubernetes
            - name: 'rpi-monitoring'
              orgId: 1
              folder: 'RPi Monitoring'
              type: file
              disableDeletion: true
              editable: false
              options:
                path: /var/lib/grafana/dashboards/rpi-monitoring
            - name: 'grafana-dashboards-network'
              orgId: 1
              folder: 'Network'
              type: file
              disableDeletion: true
              editable: false
              options:
                path: /var/lib/grafana/dashboards/grafana-dashboards-network
            - name: 'grafana-dashboards-certs'
              orgId: 1
              folder: 'Certificates'
              type: file
              disableDeletion: true
              editable: false
              options:
                path: /var/lib/grafana/dashboards/grafana-dashboards-certs
            - name: 'grafana-dashboards-nodes'
              orgId: 1
              folder: 'Nodes'
              type: file
              disableDeletion: true
              editable: false
              options:
                path: /var/lib/grafana/dashboards/grafana-dashboards-nodes
            - name: 'grafana-dashboards-storage'
              orgId: 1
              folder: 'Storage'
              type: file
              disableDeletion: true
              editable: false
              options:
                path: /var/lib/grafana/dashboards/grafana-dashboards-storage
            - name: 'grafana-dashboards-flux'
              orgId: 1
              folder: 'Flux'
              type: file
              disableDeletion: true
              editable: false
              options:
                path: /var/lib/grafana/dashboards/grafana-dashboards-flux
            - name: 'grafana-dashboards-cnpg-databases'
              orgId: 1
              folder: 'CNPG Databases'
              type: file
              disableDeletion: true
              editable: false
              options:
                path: /var/lib/grafana/dashboards/grafana-dashboards-cnpg-databases
            - name: 'grafana-dashboards-llmkube'
              orgId: 1
              folder: 'LLMKube'
              type: file
              disableDeletion: true
              editable: false
              options:
                path: /var/lib/grafana/dashboards/grafana-dashboards-llmkube
      dashboards:
        grafana-dashboards-kubernetes:
          k8s-system-api-server:
            url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-api-server.json
            token: ''
          k8s-system-coredns:
            url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-coredns.json
            token: ''
          k8s-views-global:
            url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-global.json
            token: ''
          k8s-views-namespaces:
            url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-namespaces.json
            token: ''
          k8s-views-nodes:
            url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-nodes.json
            token: ''
          k8s-views-pods:
            url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-pods.json
            token: ''
        rpi-monitoring:
          k8s-system-resource-usage:
            url: https://raw.githubusercontent.com/Peej11/homelab/refs/heads/main/kubernetes/apps/monitoring/dashboards/rpi-monitoring/resource_usage.json
            token: ''
          flux-status:
            url: https://raw.githubusercontent.com/Peej11/homelab/refs/heads/main/kubernetes/apps/monitoring/dashboards/rpi-monitoring/flux_status.json
            token: ''
          storage-status:
            url: https://raw.githubusercontent.com/Peej11/homelab/refs/heads/main/kubernetes/apps/monitoring/dashboards/rpi-monitoring/storage_status.json
            token: ''
        grafana-dashboards-network:
          envoy-proxy-global:
            url: https://raw.githubusercontent.com/Peej11/homelab/refs/heads/main/kubernetes/apps/monitoring/dashboards/network/envoy-proxy-global.json
            token: ''
          envoy-clusters:
            url: https://raw.githubusercontent.com/Peej11/homelab/refs/heads/main/kubernetes/apps/monitoring/dashboards/network/envoy-clusters.json
            token: ''
          cloudflared:
            url: https://raw.githubusercontent.com/Peej11/homelab/refs/heads/main/kubernetes/apps/monitoring/dashboards/network/cloudflared.json
            token: ''
        grafana-dashboards-certs:
          cert-manager:
            url: https://raw.githubusercontent.com/Peej11/homelab/refs/heads/main/kubernetes/apps/monitoring/dashboards/certs/cert-manager.json
            token: ''
        grafana-dashboards-nodes:
          node-exporter-full:
            url: https://raw.githubusercontent.com/Peej11/homelab/refs/heads/main/kubernetes/apps/monitoring/dashboards/nodes/node-exporter-full.json
            token: ''
        grafana-dashboards-storage:
          ceph-cluster:
            url: https://raw.githubusercontent.com/Peej11/homelab/refs/heads/main/kubernetes/apps/monitoring/dashboards/storage/ceph-cluster.json
            token: ''
          ceph-osd:
            url: https://raw.githubusercontent.com/Peej11/homelab/refs/heads/main/kubernetes/apps/monitoring/dashboards/storage/ceph-osd.json
            token: ''
          ceph-pools:
            url: https://raw.githubusercontent.com/Peej11/homelab/refs/heads/main/kubernetes/apps/monitoring/dashboards/storage/ceph-pools.json
            token: ''
        grafana-dashboards-flux:
          flux-cluster:
            url: https://raw.githubusercontent.com/Peej11/homelab/refs/heads/main/kubernetes/apps/monitoring/dashboards/flux/flux-cluster.json
            token: ''
          flux-control-plane:
            url: https://raw.githubusercontent.com/Peej11/homelab/refs/heads/main/kubernetes/apps/monitoring/dashboards/flux/flux-control-plane.json
            token: ''
        grafana-dashboards-cnpg-databases:
          cnpg:
            url: https://raw.githubusercontent.com/Peej11/homelab/refs/heads/main/kubernetes/apps/monitoring/dashboards/cnpg-databases/cnpg.json
            token: ''
        grafana-dashboards-llmkube:
          llmkube-inference:
            url: https://raw.githubusercontent.com/Peej11/homelab/refs/heads/main/kubernetes/apps/monitoring/dashboards/llmkube/llmkube-inference.json
            token: ''
          llmkube-llamacpp:
            url: https://raw.githubusercontent.com/Peej11/homelab/refs/heads/main/kubernetes/apps/monitoring/dashboards/llmkube/llmkube-llamacpp.json
            token: ''
    prometheus:
      prometheusSpec:
        replicas: 2
        podAntiAffinity: hard
        podAntiAffinityTopologyKey: kubernetes.io/hostname
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        retentionSize: 25GiB
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: rook-cephfs
              accessModes: ["ReadWriteMany"]
              resources:
                requests:
                  storage: 30Gi
