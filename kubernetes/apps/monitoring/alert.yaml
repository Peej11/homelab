---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Provider
metadata:
  name: discord
  namespace: monitoring
spec:
  type: discord
  secretRef:
    name: discord-webhook
---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: kube-prometheus-stack-kustomization-alert
  namespace: monitoring
spec:
  eventMetadata:
    summary: "Kube-Prometheus-Stack"
  providerRef:
    name: discord
  eventSeverity: info
  exclusionList:
    - "Dependencies do not meet ready condition"
  eventSources:
    - kind: Kustomization
      name: 'kube-prometheus-stack'
      namespace: monitoring
