---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: k8s-gateway
  interval: 1h
  values:
    fullnameOverride: k8s-gateway
    serviceType: LoadBalancer
    service:
      annotations:
        lbipam.cilium.io/ips: "10.211.50.2"
      externalTrafficPolicy: Cluster
    watchedResources: ["HTTPRoute", "Service"]
    securityContext:
      runAsUser: 1000
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: null
        memory: 128Mi
    servers:
      - zones:
          - zone: .
            use_tcp: true
        port: 1053
        servicePort: 53
        plugins:
          - name: errors
          - name: log
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: k8s_gateway
            parameters: "${SECRET_DOMAIN}"
            configBlock: |-
              apex k8s-gateway.network
              ttl 1
              resources HTTPRoute Service
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: forward
            parameters: . /etc/resolv.conf
          - name: loop
          - name: reload
          - name: loadbalance
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: k8s-gateway
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: k8s-gateway
              spec:
                revisionHistoryLimit: 3
