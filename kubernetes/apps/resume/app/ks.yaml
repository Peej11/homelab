---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: resume
  namespace: resumes
spec:
  dependsOn:
    - name: resume-operator
      namespace: resume-operator
  interval: 1h
  path: "./manifest"
  prune: true
  sourceRef:
    kind: GitRepository
    name: resume
  targetNamespace: resumes
  timeout: 5m
