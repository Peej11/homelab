---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  chart:
    spec:
      chart: tailscale-operator
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: tailscale
      version: 1.104.1
  interval: 24h
  values:
    installCRDs: true
    operatorConfig:
      defaultTags:
        - "tag:k8s-operator"
      hostname: tailscale-operator
      logging: info
      image:
        repository: ghcr.io/tailscale/k8s-operator
        tag: v1.104.1@sha256:38351d6333edc490a832b27b244665d40f4a5fe1765ade76af2264c99dbbfe0e
        pullPolicy: IfNotPresent
      extraEnv:
        - name: XDG_CONFIG_HOME
          value: /tmp
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 64Mi
    proxyConfig:
      image:
        repository: ghcr.io/tailscale/tailscale
        tag: v1.104.1@sha256:87c55d6be56ad85b3d8bceca5f87f73de288c609131460dd1be1874c250cc41d
      defaultTags: "tag:k8s"
      firewallMode: auto
    ingressClass:
      enabled: true
      name: tailscale
    apiServerProxyConfig:
      mode: "false"
      allowImpersonation: "false"
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: operator
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: operator
              spec:
                revisionHistoryLimit: 3
