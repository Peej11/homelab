---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  chart:
    spec:
      chart: tailscale-operator
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: tailscale
      version: 1.102.4
  interval: 24h
  values:
    installCRDs: true
    operatorConfig:
      defaultTags:
        - "tag:k8s-operator"
      hostname: tailscale-operator
      logging: info
      image:
        repository: ghcr.io/tailscale/k8s-operator
        tag: v1.102.4@sha256:3c8958c42fb3c46068e8553e11b944f2133b4671d4f36c86adc11f206746bf34
        pullPolicy: IfNotPresent
      extraEnv:
        - name: XDG_CONFIG_HOME
          value: /tmp
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 64Mi
    proxyConfig:
      image:
        repository: ghcr.io/tailscale/tailscale
        tag: v1.102.4@sha256:2667499ed87ae29218f292556ba062918402dd5e92e93637af14867e4df12dd3
      defaultTags: "tag:k8s"
      firewallMode: auto
    ingressClass:
      enabled: true
      name: tailscale
    apiServerProxyConfig:
      mode: "false"
      allowImpersonation: "false"
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: operator
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: operator
              spec:
                revisionHistoryLimit: 3
