---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  chart:
    spec:
      chart: tailscale-operator
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: tailscale
      version: 1.104.4
  interval: 24h
  values:
    installCRDs: true
    operatorConfig:
      defaultTags:
        - "tag:k8s-operator"
      hostname: tailscale-operator
      logging: info
      image:
        repository: ghcr.io/tailscale/k8s-operator
        tag: v1.104.4@sha256:68fc0aa4e1c3d7ba19ca41c0bc27f17b2a5a8dca6c10efcdd18020a6bf97768d
        pullPolicy: IfNotPresent
      extraEnv:
        - name: XDG_CONFIG_HOME
          value: /tmp
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 64Mi
    proxyConfig:
      image:
        repository: ghcr.io/tailscale/tailscale
        tag: v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
      defaultTags: "tag:k8s"
      firewallMode: auto
    ingressClass:
      enabled: true
      name: tailscale
    apiServerProxyConfig:
      mode: "false"
      allowImpersonation: "false"
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: operator
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: operator
              spec:
                revisionHistoryLimit: 3
