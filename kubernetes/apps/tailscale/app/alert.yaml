---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: tailscale-operator-alert
  namespace: flux-system
spec:
  eventMetadata:
    summary: "Tailscale Operator"
  providerRef:
    name: discord
  eventSeverity: info
  exclusionList:
    - "Dependencies do not meet ready condition"
  eventSources:
    - kind: Kustomization
      name: '*'
      namespace: tailscale
    - kind: HelmRepository
      name: '*'
      namespace: tailscale
    - kind: HelmChart
      name: '*'
      namespace: tailscale
    - kind: HelmRelease
      name: '*'
      namespace: tailscale
