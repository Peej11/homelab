---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tailscale-proxy
  namespace: tailscale
  labels:
    app.kubernetes.io/name: *app
    app.kubernetes.io/part-of: &namespace tailscale
spec:
  dependsOn:
    - name: tailscale-operator
      namespace: tailscale
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      app.kubernetes.io/namespace: *namespace
  interval: 4h
  path: ./kubernetes/apps/tailscale/proxy/app
  prune: true
  retryInterval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 10m
  wait: false
