---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: glance
  name: glance
  namespace: glance
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: glance
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glance
    spec:
      containers:
        - envFrom:
            - configMapRef:
                name: glance-env
          image: glanceapp/glance:v0.8.4@sha256:6df86a7e8868d1eda21f35205134b1962c422957e42a0c44d4717c8e8f741b1a
          name: glance
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 1m
              memory: 30Mi
            limits:
              memory: 30Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - mountPath: /app/config
              name: glance-config
            - mountPath: /app/assets
              name: glance-assets
            - mountPath: /etc/localtime
              name: glance-localtime
              readOnly: true
              subPath: localtime
      restartPolicy: Always
      volumes:
        - configMap:
            name: glance-config
          name: glance-config
        - configMap:
            name: glance-assets
          name: glance-assets
        - configMap:
            items:
              - key: localtime
                path: localtime
            name: glance-localtime
          name: glance-localtime
