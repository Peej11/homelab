---
apiVersion: ceph.rook.io/v1
kind: CephFilesystem
metadata:
  name: cephfs
  namespace: rook-ceph
spec:
  metadataPool:
    deviceClass: nvme
    failureDomain: host
    replicated:
      size: 3
  dataPools:
    - name: tank
      deviceClass: nvme
      failureDomain: host
      replicated:
        size: 3
      parameters:
        pg_num: "128"
        pgp_num: "128"
      crushRoot: default
    - name: cryo
      deviceClass: hdd
      failureDomain: osd
      erasureCoded:
        dataChunks: 3
        codingChunks: 2
      parameters:
        pg_num: "128"
        pgp_num: "128"
      crushRoot: default
  preserveFilesystemOnDelete: true
  metadataServer:
    activeCount: 1
    activeStandby: true
