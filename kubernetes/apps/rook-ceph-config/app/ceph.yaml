---
apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephConfig:
    global:
      bdev_flock_retry: "20"
      bluefs_buffered_io: "false"
      mon_data_avail_warn: "10"
    mgr:
      mgr/crash/retain_interval: "86400"
      mgr/prometheus/scrape_interval: "15"
    osd:
      osd_mclock_profile: "high_recovery_ops"
      osd_mclock_override_recovery_settings: "true"
      osd_max_backfills: "3"
  cephVersion:
    image: quay.io/ceph/ceph:v21.2.0@sha256:c9e6ed4ac3fcf67b28f38358bb9619dee4d1dfb96ddd4b9b583eee316a15f04d
  dashboard:
    enabled: true
  dataDirHostPath: /var/lib/rook
  disruptionManagement:
    managePodBudgets: true
    osdMaintenanceTimeout: 30
  mgr:
    count: 3
    allowMultiplePerNode: false
    modules:
      - name: rook
        enabled: false
  mon:
    count: 3
    allowMultiplePerNode: false
  monitoring:
    enabled: true
    metricsDisabled: false
  priorityClassNames:
    mon: system-node-critical
    osd: system-node-critical
    mgr: system-cluster-critical
  resources:
    mgr:
      requests:
        cpu: 50m
        memory: 1.2Gi
      limits:
        memory: 1.2Gi
    mon:
      requests:
        cpu: 50m
        memory: 1Gi
      limits:
        memory: 1Gi
    osd:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        memory: 4Gi
  security:
    cephx:
      allowedCiphers: ["aes256k"]
      daemon:
        keyRotationPolicy: KeyGeneration
        keyGeneration: 2
      csi:
        keyRotationPolicy: KeyGeneration
        keyGeneration: 2
        keepPriorKeyCountMax: 0
        keyType: aes256k
      rbdMirrorPeer:
        keyRotationPolicy: KeyGeneration
        keyGeneration: 2
        keyType: aes256k
  storage:
    allowDeviceClassUpdate: true
    allowOsdCrushWeightUpdate: false
    useAllNodes: true
    useAllDevices: true
