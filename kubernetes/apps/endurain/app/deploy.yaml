---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: endurain
  namespace: endurain
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: endurain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: endurain
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
      containers:
        - name: endurain
          image: ghcr.io/endurain-project/endurain:v0.17.6@sha256:d18d18d69b0c280db85c6f91172b678fcfc58b081e835aa6284b63b0fb87e023
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: "America/Chicago"
            - name: BEHIND_PROXY
              value: "true"
            - name: ENDURAIN_HOST
              value: https://endurain.${SECRET_DOMAIN}
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: endurain-app
                  key: dbname
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: endurain-superuser
                  key: host
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: endurain-superuser
                  key: password
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: endurain-superuser
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: endurain-superuser
                  key: dbname
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: endurain-superuser
                  key: user
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: endurain-superuser
                  key: user
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: endurain-config
                  key: SECRET_KEY
            - name: FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: endurain-config
                  key: FERNET_KEY
            - name: SMTP_SECURE
              value: "true"
            - name: SMTP_SECURE_TYPE
              value: "starttls"
            - name: UID
              value: "1000"
            - name: GID
              value: "1000"
          livenessProbe:
            httpGet:
              path: /openapi.json
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /openapi.json
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              add:
                - CHOWN
                - SETGID
                - SETUID
              drop:
                - ALL
          volumeMounts:
            - mountPath: /app/backend/data
              name: data
            - mountPath: /app/backend/logs
              name: logs
          resources:
            requests:
              cpu: 350m
              memory: 500Mi
            limits:
              memory: 500Mi
      restartPolicy: Always
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: endurain
        - name: logs
          emptyDir:
            sizeLimit: 5Gi
