---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./hr.yaml
  - ./rbac.yaml
  - ./secret.sops.yaml
configMapGenerator:
  - name: gatus-configmap
    namespace: gatus
    files:
      - ./resources/config.yaml
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
