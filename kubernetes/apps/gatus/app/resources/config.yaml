---
alerting:
  discord:
    title: ":helmet_with_cross:"
    webhook-url: ${DISCORD_WEBHOOK}
    default-alert:
      send-on-resolved: true
      failure-threshold: 3
      success-threshold: 3
  homeassistant:
    url: https://homeassistant.${SECRET_DOMAIN}
    token: ${HOMEASSISTANT_TOKEN}
    default-alert:
      send-on-resolved: true
      failure-threshold: 3
      success-threshold: 3
  pushover:
    title: "Gatus: <endpoint>"
    application-token: ${PUSHOVER_TOKEN}
    user-key: ${PUSHOVER_USER_KEY}
    default-alert:
      send-on-resolved: true
      failure-threshold: 5
      success-threshold: 5

connectivity:
  checker:
    target: 1.1.1.1:53
    interval: 1m

endpoints:
  - name: Cloudflare
    group: connectivity
    url: icmp://1.1.1.1
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: Google
    group: connectivity
    url: icmp://8.8.8.8
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

metrics: true

storage:
  type: sqlite
  caching: true
  path: ${GATUS_CONFIG_PATH}/gatus.db

ui:
  title: Status | Gatus
  header: Status
  logo: https://avatars.githubusercontent.com/u/2296277
  link: https://github.com/Peej11
  buttons:
    - name: Github
      link: https://github.com/Peej11
    - name: Homelab
      link: https://github.com/Peej11/homelab
  default-filter-by: unstable
  default-sort-by: health

web:
  port: ${GATUS_WEB_PORT}
