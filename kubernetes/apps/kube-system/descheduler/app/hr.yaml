---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
  namespace: kube-system
spec:
  chart:
    spec:
      chart: descheduler
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: descheduler
      version: 0.36.0
  install:
    crds: Create
    remediation:
      retries: 3
  interval: 1h
  values:
    schedule: "*/5 * * * *"
