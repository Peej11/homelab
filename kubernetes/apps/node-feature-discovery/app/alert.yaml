---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: node-feature-discovery-alert
  namespace: flux-system
spec:
  summary: "Node Feature Discovery"
  providerRef:
    name: discord
  eventSeverity: info
  eventSources:
    - kind: OCIRepository
      name: '*'
      namespace: node-feature-discovery
    - kind: HelmRelease
      name: '*'
      namespace: node-feature-discovery
