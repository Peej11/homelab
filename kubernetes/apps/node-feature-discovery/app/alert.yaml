---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: node-feature-discovery-alert
  namespace: flux-system
spec:
  eventMetadata:
    summary: "Node Feature Discovery"
  providerRef:
    name: discord
  eventSeverity: info
  exclusionList:
    - "Dependencies do not meet ready condition"
  eventSources:
    - kind: OCIRepository
      name: '*'
      namespace: node-feature-discovery
    - kind: HelmRelease
      name: '*'
      namespace: node-feature-discovery
