---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Flate"

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    name: Flate - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: kubernetes/**/*

  flate:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Flate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Flate
        uses: home-operations/flate/action@4e07f351352d235a335e5a1f0a088eab7ec40997 # v0.8.0
        with:
          cache: true

      - name: Cluster-secrets substitutions
        run: |
          find kubernetes -name '*.yaml' -exec sed -i \
            -e 's|\${SECRET_DOMAIN/\./-}|ci-example.com|g' \
            -e 's|\${SECRET_DOMAIN}|ci.example.com|g' \
            -e 's|\${SECRET_DNS}|ci.example.com|g' {} +

      - name: Supply reflected cluster-secrets
        run: |
          find kubernetes -name '*.yaml' -not -name '*.sops.yaml' \
            -exec yq -N 'select(.kind == "Namespace") | .metadata.name' {} + \
            | sort -u | while read -r ns; do
              printf -- '---\napiVersion: v1\nkind: Secret\nmetadata:\n  name: cluster-secrets\n  namespace: %s\nstringData:\n  SECRET_DOMAIN: ci.example.com\n  SECRET_DNS: ci.example.com\n' "$ns"
            done > "${RUNNER_TEMP}/supply.yaml"

      - name: Run Flate
        id: flate
        run: flate test all -p ./kubernetes/flux/cluster --allow-missing-kinds Secret --supply "${RUNNER_TEMP}/supply.yaml"

  success:
    if: ${{ !cancelled() }}
    needs: flate
    name: Flate - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
